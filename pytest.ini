[tool:pytest]
testpaths = .
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=wifipw
    --cov-report=term-missing
    --cov-report=html:htmlcov

[coverage:run]
source = .
omit = 
    test_*.py
    *_test.py
    setup.py
    __pycache__/*
    .venv/*
    venv/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if __name__ == .__main__.:
    raise AssertionError
    raise NotImplementedError